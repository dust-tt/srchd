name: Lint & TypeCheck

on:
  pull_request:
    branches: ["main"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-changed:
    name: Lint changed files in PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Checkout and git diff against base
      pull-requests: read # PR metadata for base/head SHAs
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # Fetch history for changed-files detection via git diff
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get changed TypeScript files
        id: changed-files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Replace tj-actions/changed-files (CVE-2025-30066) with local git diff.
          # Filter after diff so nested paths under src/ are included (plain git
          # pathspecs treat ** as a single directory level without :(glob)).
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- src \
              | grep -E '\.tsx?$' \
              | grep -Ev '\.(test|spec)\.ts$' || true
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${files[@]}" > "${RUNNER_TEMP}/changed-ts-files.txt"
          fi

      - name: Restore ESLint cache
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: .eslintcache
          key: eslint-cache-pr-${{ runner.os }}-${{ hashFiles('**/eslint.config.ts') }}-${{ hashFiles('**/tsconfig.json') }}
          restore-keys: |
            eslint-cache-pr-${{ runner.os }}-${{ hashFiles('**/eslint.config.ts') }}-
            eslint-cache-pr-${{ runner.os }}-
            eslint-cache-${{ runner.os }}-

      - name: Lint changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          set -euo pipefail
          echo "Linting changed files:"
          cat "${RUNNER_TEMP}/changed-ts-files.txt"
          mapfile -t files < "${RUNNER_TEMP}/changed-ts-files.txt"
          NODE_OPTIONS='--max-old-space-size=8192' npx eslint --cache --cache-location .eslintcache "${files[@]}"

      - name: No files to lint
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No TypeScript files changed in this PR"

      - name: TypeCheck
        run: npm run typecheck
